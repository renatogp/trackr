[tox]
envlist = 3.1{3,2,1}, flake8, coverage

[testenv:flake8]
allowlist_externals=make
basepython=python
deps=flake8
commands=flake8 --ignore=E501 trackr

[testenv:coverage]
allowlist_externals=make
basepython=python
deps=
    -r{toxinidir}/requirements_dev.txt
    codecov
commands=
    make coverage
    codecov

[testenv]
allowlist_externals=make
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/trackr
    LC_ALL = en_US.utf-8
    LANG = en_US.utf-8
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    make test
